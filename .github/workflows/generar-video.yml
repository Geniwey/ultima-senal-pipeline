name: Generar Video Definitivo

on:
  workflow_dispatch:
    inputs:
      tema:
        description: 'Tema del documental'
        required: true
        default: 'Aeroperú 603: el vuelo que voló ciego'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar FFmpeg y Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg tesseract-ocr tesseract-ocr-eng tesseract-ocr-spa

      - name: Instalar dependencias Python
        run: |
          pip install --upgrade pip
          pip install groq openai requests pillow numpy matplotlib edge-tts pytesseract

      - name: Test de integridad antes de ejecutar
        run: python test_pipeline.py

      - name: Ejecutar pipeline documental
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python pipeline_auto.py "${{ github.event.inputs.tema }}"

      - name: Subir artefactos generados
        uses: actions/upload-artifact@v4
        with:
          name: video-definitivo-${{ github.run_id }}
          path: |
            output/*.mp4
            output/*.jpg
            output/*.png
            output/*.json
