name: Generar Vídeo - Última Señal

on:
  workflow_dispatch:
    inputs:
      titulo:
        description: "Título / tema del vídeo (ej: Vuelo 447 de Air France)"
        required: true
        type: string

jobs:
  generar-video:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar dependencias Python
        run: pip install requests groq openai edge-tts

      - name: Recuperar progreso de intentos anteriores (mismo título)
        uses: actions/cache@v4
        with:
          path: proyecto
          # PIPELINE_VERSION: súbela cada vez que cambiemos algo que afecte
          # a la calidad de las imágenes/estilo (proveedor, prompts, etc.)
          # para que la caché vieja se invalide sola y no se reutilicen
          # imágenes generadas con una versión anterior peor del pipeline.
          key: ultima-senal-v2-${{ inputs.titulo }}-${{ github.run_id }}
          restore-keys: |
            ultima-senal-v2-${{ inputs.titulo }}-

      - name: Ejecutar pipeline completo
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
          MODELSLAB_API_KEY: ${{ secrets.MODELSLAB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
        run: python pipeline_auto.py "${{ inputs.titulo }}"

      - name: Subir vídeo final
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_id }}
          path: |
            proyecto/video_final.mp4
            proyecto/miniatura.png
            proyecto/metadata_youtube.txt
            proyecto/guion.json
            proyecto/imagenes/
          retention-days: 21
