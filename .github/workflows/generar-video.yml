name: Generar Video Última Señal

on:
  workflow_dispatch:
    inputs:
      titulo:
        description: "Título/tema del vídeo (ej: Aeroperú 603)"
        required: true
        type: string

jobs:
  generar-video:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar dependencias Python
        run: pip install requests groq openai edge-tts gradio_client

      - name: Ejecutar pipeline completo
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
        run: python pipeline_auto.py "${{ inputs.titulo }}"

      - name: Subir video final
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_id }}
          path: |
            proyecto/video_final.mp4
            proyecto/miniatura.png
            proyecto/metadata_youtube.txt
            proyecto/guion.json
            proyecto/imagenes/
          retention-days: 21
